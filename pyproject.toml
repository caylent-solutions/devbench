[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devbench"
version = "0.3.0"
description = "Autonomous SDLC orchestration system"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.84.0",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "claude-agent-sdk>=0.1.48",
    "jsonschema>=4.0.0",
]

# Issue #162 Phase 7 (ADR-21): opt-in Parquet cold archive. The mainline
# install picks up zero new mandatory deps; operators who want to
# archive ended sessions for long-term retention install the [archive]
# extra.
[project.optional-dependencies]
archive = ["pyarrow>=15.0.0"]

[project.scripts]
devbench = "devbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devbench"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.15.0",
    "bandit>=1.8.0",
    "mypy>=1.15.0",
    "types-pyyaml>=6.0.12.20250915",
    "types-jsonschema>=4.23.0.20241208",
    # Issue #162 Phase 7: tests exercise the [archive] extra's
    # round-trip behaviour. Mainline `pip install devbench` does NOT
    # carry pyarrow; only `pip install devbench[archive]` does. The
    # dev-group install pulls it in so the test suite can pin the
    # parity contract without operators paying the install cost.
    "pyarrow>=15.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "RUF",    # ruff-specific
    "S",      # flake8-bandit
]
ignore = [
    "S603",    # subprocess calls — needed for git/gh/claude CLI
    "S607",    # partial executable path — we call known tools
    "PLR0913", # too many arguments — judges need context
    "S101",    # assert in tests
    "S105",    # Possible hardcoded password — Verdict.PASS is not a password
    "PLW1510", # subprocess.run without check — we check returncode manually
    "S108",    # Insecure temp file — /tmp path is configurable via env var
    "S608",    # SQL injection via string-based query — variable-length IN(?,?,?) clauses build a placeholder-only sub-string from ",".join("?" for _) — no user input ever flows into the SQL string; values pass through the params argument as bound parameters, which is the standard Python sqlite3 idiom (issue #168)
    "ARG002",  # unused method args — abstract base class requires signature conformance
    "PLR2004", # magic values — thresholds are self-documenting in context
    "PLR0915", # too many statements — orchestrator process_work_unit is a state machine
    "SIM117",  # nested with — clearer in some test patterns
    "RUF059",  # unpacked unused var — we unpack for clarity of tuple structure
    "RUF005",  # list concatenation — ["git"] + args is clear
    "PLC0415", # import not at top level — some judges do conditional imports
    "TC003",   # move import to type-checking block — not needed for this project
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "PLR2004", "S", "TCH", "PLC0415", "E741", "PT", "SIM117", "RUF059"]
# cli.py pre-parses --config before devbench imports so config.py loads the
# correct YAML at import time; E402 is intentional here.
"src/devbench/cli.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
mypy_path = ["src", "tests", "tools"]
explicit_package_bases = true

[tool.coverage.run]
source = ["devbench"]

[tool.coverage.report]
# The ``if __name__ == "__main__":`` block at the bottom of devbench/cli.py
# is the script-style entry point used by ``python -m devbench.cli``; it is
# not reachable from import-driven unit tests but is exercised by every
# integration test that shells out to the CLI.  Exclude it from the
# coverage gate so the gate measures testable code only (this is a coverage
# config exclusion, not an inline ``# pragma: no cover`` annotation).
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]
python_classes = ["Test*"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
markers = [
    "unit: unit tests (run with pytest -m unit)",
    "functional: functional/integration tests (run with pytest -m functional)",
    "integration: integration tests (run with pytest -m integration)",
]

# DevBench runtime configuration -- comprehensive reference.
#
# Copy this file to `<workspace>/backlog/config/devbench.yaml` as a starting
# point. Every YAML field defined in `src/devbench/config-schema.json` is
# represented below at its default value.
#
# Precedence: env var > this YAML > code default. Schema validation runs at
# load time; any unknown key fails with a clear error.

# ---------------------------------------------------------------------------
# Required: at least one repo
# ---------------------------------------------------------------------------
repos:
  caylent-solutions/devbench:
    default_branch: main
    checkout_directory: devbench
    # Per-repo merge_strategy override; falls back to the top-level merge_strategy.
    # merge_strategy: squash

# ---------------------------------------------------------------------------
# Top-level identity / runtime knobs
# ---------------------------------------------------------------------------

# Default merge strategy for every repo unless overridden per-repo above.
merge_strategy: squash

# Maximum executor retries per work unit -- shared budget across review-judge
# retries, CI-failure retries, and PR-bot-feedback retries (see git_ops below).
max_executor_retries: 10

# Per-judge override of max_executor_retries (issue #122). Each value falls
# back to max_executor_retries when absent. Useful when one judge is flakey
# (more retries) and another is stable (fewer retries to fail-fast on real bugs).
# iac_review only takes effect when optional_judges.iac_review is true.
max_executor_retries_per_judge:
  code_review: 10
  test_review: 10
  doc_review: 10
  changes_manifest: 10
  security_review: 10
  # iac_review: 10

# Optional specialty review judges. The always-on core 5 (code_review,
# test_review, doc_review, changes_manifest, security_review) are mandatory and
# NOT listed here. Each optional judge defaults to false (disabled): a disabled
# judge is never dispatched and never required by the done-gate. When enabled,
# iac_review (the evidence-verifying IaC judge, no live AWS) is auto-required for
# a unit only when that unit's `## Verification` contract contains an
# infrastructure item -- deterministically, never authored by hand. Override via
# the DEVBENCH_JUDGE_IAC_REVIEW_ENABLED env var. Enable on AWS IaC projects.
# optional_judges:
#   iac_review: false

# Deterministic Acceptance-Criteria evidence-gate settings, enforced at
# mark-done. allow_deferred_evidence: false (the default) blocks a unit that has
# any type=deferred (operator-only) Verification item from being marked done and
# surfaces it loudly. Set true to let deferred ACs pass without tool-captured
# evidence. Override via DEVBENCH_DONE_GATE_ALLOW_DEFERRED_EVIDENCE.
# done_gate:
#   allow_deferred_evidence: false

# When true, route LLM calls via AWS Bedrock instead of the Anthropic API.
use_bedrock: false

# AWS region for Bedrock when use_bedrock: true.
bedrock_region: us-east-1

# Model routing summary:
#   - The top-level ORCHESTRATE SESSION model is `orchestrate.model` (below).
#     When devbench launches the orchestrator non-interactively (`devbench start`
#     / `--daemon`) it PINS the SDK session to that value, so the session can
#     never inherit the interactive Claude Code (~/.claude/settings.json) model.
#     It is required for `devbench start`; there is NO fallback. (When you run
#     the `/devbench-orchestrate:orchestrate` slash command inside your own
#     interactive Claude Code session, the skill runs on YOUR selected model --
#     devbench cannot override the host session; `orchestrate.model` governs the
#     SDK-launched orchestrator only.)
#   - The work agents (executor / judges / etc.) load their model from each
#     agent's plugin .md frontmatter and can be overridden via the `agents:`
#     block lower in this file (ADR-25).

# Hard allowlist of GitHub orgs devbench may operate against. Empty means
# every org listed in repos: above is permitted; otherwise restrict here.
allowed_orgs: []

# IANA timezone applied to every timestamp-rendering command (report,
# hook-tail, watch). Unset = OS local timezone.
# display_timezone: America/New_York

# Workspace-relative path to the orchestrator's shared aggregate log file.
# Both the writer (setup_logging) and the readers (report, hook-tail, watch)
# consult this single source of truth so they cannot diverge. Named sessions
# additionally get a per-session log at .devbench/sessions/<name>/orchestrator.log
# (read via `report --session <name>`). DEVBENCH_LOG_FILE overrides at runtime.
log_file: logs/orchestrator.log

# ---------------------------------------------------------------------------
# Quota wait-and-resume (Issue #236, AC-236-1, D-Q-1).
# Controls how the orchestrate loop handles Anthropic subscription rate-limit
# errors (HTTP 429 / CLI "You've hit your limit" signal).
#
# enabled: true (default) -- the orchestrator pauses and waits for the quota
#   window to reset rather than exiting with a non-zero code. Set to false to
#   restore the legacy behaviour (propagate the error, non-zero exit).
# on_exhaustion: what to do when a quota error is detected.
#   "wait"  -- pause and poll until reset_at (default).
#   "fail"  -- re-raise immediately (non-zero exit, same as enabled:false).
#   "drain" -- trigger a graceful drain then exit.
# poll_interval_seconds: base cadence for the recovery probe loop (30-3600).
# max_wait_seconds: cap on total wait time; returns False/drain if exceeded.
# on_exhaustion_timeout: what to do when max_wait_seconds is exceeded.
#   "drain"        -- trigger a graceful drain (default).
#   "fail"         -- re-raise the quota error.
#   "keep_waiting" -- ignore the cap and keep polling.
# resume_strategy: how to re-enter the orchestrate loop after recovery.
#   "continue_current_wu" -- resume where we left off (default).
#   "restart_wu"          -- force the current WU back to in-queue.
#   "drain_and_resume"    -- drain and let the Makefile restart loop do it.
# audit_comment_on_wait: write a [QUOTA_WAITING] audit comment to the active
#   work unit when pausing. Defaults to true.
# audit_comment_on_resume: write a [QUOTA_RESUMED] audit comment when the
#   wait ends. Defaults to true.
# log_structured_events: emit JSON-structured events alongside the text
#   markers. Defaults to true.
# ---------------------------------------------------------------------------
quota_handling:
  enabled: true
  on_exhaustion: wait
  poll_interval_seconds: 60
  max_wait_seconds: 18000
  on_exhaustion_timeout: drain
  resume_strategy: continue_current_wu
  audit_comment_on_wait: true
  audit_comment_on_resume: true
  log_structured_events: true

# ---------------------------------------------------------------------------
# Supervise: interactive `claude` CLI orchestrator under a detached `screen`
# daemon (devbench supervise start|stop|restart|status|info|attach).
#
# The billing channel is selected by billing_mode (default subscription):
#   - subscription: token consumption draws from the Claude Code Max plan's
#     rolling 5-hour windows (the 5-hour quota wait-and-resume is engaged).
#   - bedrock: inference routes through AWS Bedrock (always-on; no 5-hour
#     windows; the 5-hour wait is disabled).
# In BOTH modes the AWS workload creds (AWS_ACCESS_KEY_ID/.../AWS_PROFILE) and
# region pass through -- they do not route Claude billing, and the orchestrator
# runs live AWS terratests that need them.
# It is purely additive -- it does not change `devbench start` (the SDK path).
# All values are optional with the documented defaults below; each is also
# overridable via a DEVBENCH_SUPERVISE_* env var (env > yaml > default).
# The quota wait-and-resume REUSES the quota_handling block above (DRY).
#
# Uncomment and edit to override. `screen` must be installed (system dep).
# ---------------------------------------------------------------------------
# supervise:
#   model: null                       # null falls back to orchestrate.model then fail-fast (D-3); DEVBENCH_CLAUDE_MODEL is NOT used
#   effort: xhigh                      # low|medium|high|xhigh|max (xhigh default; max is session-only)
#   billing_mode: subscription         # subscription (default; 5-hour windows) | bedrock (AWS Bedrock, no windows). Precedence: --billing-mode flag > DEVBENCH_SUPERVISE_BILLING_MODE env > this > default
#   screen_name_prefix: devbench-supervise-
#   timeouts:
#     ready_prompt_seconds: 120        # wait for the first interactive ready prompt
#     idle_seconds: 1800               # max silence before treating the session as hung
#     command_ack_seconds: 60          # wait for a slash command to be acknowledged
#     quota_poll_interval_seconds: null  # null reuses quota_handling.poll_interval_seconds
#     quota_max_wait_seconds: null     # null reuses quota_handling.max_wait_seconds (5h)
#     graceful_stop_seconds: 900       # graceful drain budget before escalating to hard stop
#     poll_interval_seconds: 2         # registry-poll (stop wait) + attach tail re-read cadence (bounded select, no sleep)
#     command_invocation_seconds: 30   # safety timeout bounding short subprocess shell-outs (screen -ls / -X quit / --version)
#     command_submit_quiet_seconds: 1  # slash-command submit: no-output quiet window signalling the autocomplete menu render has settled before Enter
#     command_submit_settle_seconds: 8 # slash-command submit: max render-settle wait before Enter is sent regardless (the / menu swallows a premature newline)
#   restart:
#     max_attempts: 5                  # bounded auto-restart on the exit-42-equivalent
#     resume_mode: continue            # continue | resume (resume uses the captured session id)
#   quota:
#     max_quota_resumes: null          # null falls through to DEFAULT_MAX_QUOTA_RESUMES (1000) / DEVBENCH_MAX_QUOTA_RESUMES
#   detection_patterns:                # version-fragility hardening -- all Claude-CLI-output regexes centralized here
#     ready_prompt: '(?m)^\s*(>|.\s*>)\s*$'
#     working_prompt: '(?i)(esc to interrupt|tokens|thinking)'
#     quota_limit: '(?i)(You have hit your limit|rate.?limit.*(exceeded|reached|resets))'  # DI-5 placeholder
#     quota_wait_prompt: '(?i)(wait.*reset|retry.*later|press.*to wait)'                    # DI-5 placeholder
#     reset_at: 'resets\s+(\d{1,2}):(\d{2})(am|pm)\s+\(UTC\)'
#     circuit_breaker: '\[CIRCUIT_BREAKER\]|cascade depth exceeded'
#     harness_block: '\[HARNESS_INTEGRITY\]'
#     crash: '(?i)(panic|fatal error|traceback \(most recent call last\))'
#   log_tail:                          # devbench's own log markers (stable across CLI versions) for hybrid detection
#     orchestrator_log_relpath: logs/orchestrator.log
#     markers_clean: ["ALL_DONE", "NO_ACTIONABLE", "[ORCHESTRATOR_TERMINAL_EXIT]"]
#     markers_quota: ["[QUOTA_WAITING]", "[QUOTA_POLLING]", "[ORCHESTRATOR_QUOTA_RESUME]"]
#     markers_fault: ["[ORCHESTRATOR_STOP_REASON]", "[ORCHESTRATOR_FATAL_ERROR]", "[HARNESS_INTEGRITY]"]
#     markers_restart: ["[ORCHESTRATOR_AUTO_RESTART]"]
#   env:
#     deny_vars: []                    # ADDITIONAL deny vars layered on the mode-resolved routing deny set (non-removable). AWS workload creds are NOT denied (they pass through in both modes)
#   logging:
#     pty_log_relpath: pty.log         # under the session state dir; created mode 0600
#     redact_patterns: ["sk-ant-[A-Za-z0-9_-]+", "AKIA[0-9A-Z]{16}", "(?i)aws_secret[^\\s]*", "Bearer\\s+[A-Za-z0-9._-]+"]
#   injectable_commands:               # extensible name->literal map; add capabilities via config, no code change
#     orchestrate: "/devbench-orchestrate:orchestrate"
#     effort_xhigh: "/effort xhigh"
#     model_opus: "/model opus"
#     quota_wait_choice: "1"           # DI-5 placeholder
#     drain_now: "/exit"

# ---------------------------------------------------------------------------
# Timeouts (seconds)
# ---------------------------------------------------------------------------
timeouts:
  gh_api: 30
  test: 300
  security_fetch: 120
  llm: 300
  command: 120
  orchestrator_poll_interval: 10
  github_check: 600
  # Per-message inactivity timeout in seconds (float). Each await for the next
  # SDK message is wrapped in asyncio.wait_for with this timeout; the timer
  # resets on every received message so long legitimate turns never trip it.
  # On expiry logs [ORCHESTRATOR_INACTIVITY_TIMEOUT] and triggers an in-session
  # continuation (counting against the E10-F1-S3 budget). A value <= 0 disables
  # the timeout. Override via DEVBENCH_ORCHESTRATOR_INACTIVITY_TIMEOUT_SECONDS.
  # Default: 300.0 (5 minutes). Issue #262 (E10-F2-S1).
  orchestrator_inactivity_timeout: 300.0

# ---------------------------------------------------------------------------
# Limits / thresholds
# ---------------------------------------------------------------------------
limits:
  alert_summary: 10
  output_truncation: 2000
  llm_evidence_truncation: 15000
  llm_file_context: 5
  llm_file_preview_chars: 3000
  # Issue #115: byte cap for the trimmed failing-job log written to
  # `<workspace>/.devbench/ci-failures/<id>-<n>.log`. Caps executor feedback
  # payload size. Operators bump this when CI logs legitimately need a
  # longer relevant tail (rare).
  ci_failure_log_bytes: 32768

# ---------------------------------------------------------------------------
# Git operations
# ---------------------------------------------------------------------------
git_ops:
  # Set true only when target repos are git submodules of a parent workspace
  # repo. When true, the parent repo's submodule pointer is updated after
  # each PR merge.
  update_submodule: false
  # Single-branch mode: every work unit commits to this branch (see defer_pr
  # below). Unset = standard multi-PR mode (one branch per work unit).
  # single_branch: feat/my-batch-branch
  # Defer-PR mode: commits stay local until `devbench git-ops-finalize` runs.
  # Requires single_branch to be set.
  defer_pr: false
  # Issue #101: when true, cmd_git_ops pushes the PR + waits for green CI,
  # then transitions the work unit to in-review instead of merging. The
  # orchestrator's loop reconciles in-review tasks via cmd_check_merge.
  # Mutually exclusive with defer_pr and single_branch (validated at load).
  pause_before_merge: false
  # Phase 1 of the orphan-cascade fix. When true (the default), git-ops
  # runs cleanup_tracked_orphans inline as a chore commit before the task's
  # commit when build/state orphan paths are detected.
  inline_orphan_cleanup: true
  # Issue #115: when true (the default after the v-next flip), CI failure
  # returns rc=2 to trigger an executor retry with the failing-job log as
  # feedback. Set to false for the legacy rc=1 BLOCKED behaviour.
  ci_failure_retry: true
  # Operator override of the built-in orphan-pattern fnmatch list. Empty =
  # use the built-in list (terraform state, terragrunt cache, Python
  # pycache, coverage, etc.). Non-empty REPLACES the built-in entirely.
  orphan_patterns: []
  # When true, the orchestrate skill automatically invokes
  # `devbench git-ops-finalize <repo>` once all work units for the repo
  # are terminal. Requires defer_pr: true. Incompatible with local_only: true.
  # A marker file at <workspace>/.devbench/auto-finalize-fired-<repo>.marker
  # prevents duplicate invocations. Default: false.
  auto_finalize: false
  # When true, the orchestrate skill automatically invokes
  # `gh pr merge --<merge_strategy>` once the post-E7 CI watcher reports
  # GREEN. Requires auto_finalize: true AND defer_pr: true.
  # Incompatible with local_only: true. When the E7 watcher is absent,
  # emits [AUTO_MERGE_SKIPPED] no_ci_watcher and skips. A marker file at
  # <workspace>/.devbench/auto-merge-fired-<repo>.marker prevents duplicates.
  # Default: false.
  auto_merge: false
  # Issue #116: opt-in PR review-comment polling. When enabled, cmd_git_ops
  # polls `gh pr view` between CI-pass and merge for asynchronous review
  # bot comments (Copilot, Q-Dev, internal review services).
  pr_review_resolution:
    enabled: false
    # Comma-separated logins whose unresolved comments block the merge.
    # Example: ["github-copilot[bot]", "amazon-q-developer[bot]"]
    agents: []
    # When true, reviewDecision == CHANGES_REQUESTED hard-blocks merge
    # regardless of bot allowlist.
    decision_blocks: true
    # Total settle-window length, seconds.
    settle_seconds: 60
    # Per-poll cadence inside the settle window, seconds.
    poll_interval: 5

# ---------------------------------------------------------------------------
# Stop-hook circuit breaker
# ---------------------------------------------------------------------------
stop_hook:
  max_blocks: 5
  # Quiet-window cap for the circuit breaker. Doubles as the threshold
  # for `devbench report`'s orchestrator-alive banner (issue #161): a
  # log line within this many seconds renders the banner green ALIVE,
  # past it renders red STOPPED. Tune this once for your workload's
  # quiet-window tolerance and the banner stays aligned automatically.
  window_seconds: 180
  stale_task_minutes: 120

# ---------------------------------------------------------------------------
# devbench hook-tail column caps (issue #134)
# ---------------------------------------------------------------------------
hook_tail:
  # Column width for the agent name.
  agent_width: 12
  # Column width for the tool name.
  tool_width: 8
  # Max chars for the description column (bumped from 100 in v-next).
  description_max: 120
  # Max chars for the result-preview column after the pipe.
  stdout_preview_max: 80

# ---------------------------------------------------------------------------
# Orchestrator runtime tuning (issue #144)
# ---------------------------------------------------------------------------
orchestrate:
  # Cap on recovery-of-a-recovery cascade depth. When a proposal would land
  # at depth >= this cap, the source task transitions to
  # NEEDS_OPERATOR_ATTENTION instead of materialising another recovery
  # layer. Override via DEVBENCH_ORCHESTRATE_MAX_CASCADE_DEPTH env var.
  max_cascade_depth: 2
  # Model for the top-level orchestrate SDK session launched by `devbench start`
  # / `--daemon`. devbench passes this into ClaudeAgentOptions(model=...) so the
  # session is pinned to it and never inherits the interactive Claude Code
  # (~/.claude/settings.json) selection. REQUIRED to launch the orchestrator;
  # no env/settings fallback (the launch fails fast when unset). Short name
  # (opus|sonnet) or full Anthropic id when use_bedrock:false; Bedrock ARN when
  # true. Haiku is rejected (#198). Does NOT affect the interactive
  # /devbench-orchestrate:orchestrate slash command (runs on the host session's model).
  model: claude-opus-4-8
  # Startup harness-integrity check (ADR-30). Before any SDK subprocess is
  # spawned, `devbench start` compares the devbench checkout against committed
  # git state and reacts to uncommitted edits under the devbench package source
  # (src/devbench/**) -- the signature of a prior orchestrate self-edit or an
  # unreviewed manual change. 'off' skips it; 'warn' (the default) emits a loud
  # [HARNESS_INTEGRITY] warning and continues; 'fail' refuses to start. Pairs
  # with the guard-harness-write.sh PreToolUse hook that hard-denies the session
  # from editing the harness in the first place.
  harness_integrity_check: warn
  # Within-claim repeated-failure bound. A single in-progress claim that repeats
  # the SAME unresolvable AC-verify / TDD-RED / live-test signature
  # max_within_claim_attempts times -- while staying busy so the inactivity
  # budget keeps resetting -- is BLOCKED with a [CLAIM_NOT_CONVERGING] audit
  # comment instead of churning for hours. Keyed on the REPEATED IDENTICAL
  # signature (NOT raw duration), so a genuinely-progressing long live run
  # (a different signal each round) is never killed. Default on.
  within_claim_convergence_check: true
  # How many times the SAME failing signature may recur within one claim before
  # the bound trips. Default 4. Override via
  # DEVBENCH_ORCHESTRATOR_MAX_WITHIN_CLAIM_ATTEMPTS.
  max_within_claim_attempts: 4
  # Secondary wall-clock backstop for a single claim, in seconds. Set well above
  # the observed-legit maximum (e.g. a 3.5h live firehose apply) so it only fires
  # on an implausibly long stuck claim with no repeated-identical signature.
  # Default 21600 (6h); 0 disables the backstop (the signature bound still
  # applies). Override via DEVBENCH_ORCHESTRATOR_MAX_CLAIM_WALL_CLOCK_SECONDS.
  max_claim_wall_clock_seconds: 21600
  # Aggregate safety valve for block-and-continue. A single non-converging claim
  # is BLOCKED (above) and the session CONTINUES to its next in-queue unit -- one
  # bad module no longer abandons the rest of a session's scope. This caps how
  # many DISTINCT units may each trip the convergence bound in ONE session before
  # the session halts for operator attention with
  # `[ORCHESTRATOR_STOP_REASON] reason=too many non-converging claims (K)`.
  # Default 3 (must be >= 1). Override via
  # DEVBENCH_ORCHESTRATOR_MAX_NON_CONVERGING_CLAIMS.
  max_non_converging_claims: 3

# ---------------------------------------------------------------------------
# Report / cost estimation
# ---------------------------------------------------------------------------
report:
  # Per-model token pricing (issue #223).  Each key is a Claude model id
  # (the literal `message.model` value Claude Code records on every
  # `assistant` message envelope, e.g. `claude-opus-4-7`).  The two
  # mandatory fields are `input` and `output` in USD per 1M tokens.
  #
  # Optional per-model overrides:
  #   - cache_read_multiplier      override report.cache_read_multiplier for this model
  #   - cache_write_5min_multiplier override report.cache_write_5min_multiplier
  #   - cache_write_1hr_multiplier  override report.cache_write_1hr_multiplier
  #   - correction_factor          per-model contract correction; default 1.0
  #
  # Set `correction_factor` per model when reported cost drifts from your
  # actual Anthropic invoice on THAT model only.  Use
  # `devbench cost-calibrate <actual-usd>` to compute and write the
  # correction factor instead of editing this file by hand.
  #
  # The legacy scalar fields (`token_cost_per_million_input`,
  # `token_cost_per_million_output`, `token_cost_discount`) were retired
  # in issue #223 in favour of this block.  Workspaces that still set
  # them get a fail-fast error at config-load time.
  models:
    claude-opus-4-7:
      input: 5.0
      output: 25.0
    claude-opus-4-6:
      input: 5.0
      output: 25.0
    claude-opus-4-5:
      input: 5.0
      output: 25.0
    claude-opus-4-1:
      input: 15.0
      output: 75.0
    claude-opus-4:
      input: 15.0
      output: 75.0
    claude-sonnet-4-6:
      input: 3.0
      output: 15.0
    claude-sonnet-4-5:
      input: 3.0
      output: 15.0
    claude-sonnet-4:
      input: 3.0
      output: 15.0
    claude-haiku-4-5:
      input: 1.0
      output: 5.0
    claude-haiku-3-5:
      input: 0.80
      output: 4.0
    claude-haiku-3:
      input: 0.25
      output: 1.25
  # Rates applied to any transcript message whose `model` field is missing
  # OR a model id not present in `report.models` above.  Defaults to Opus
  # 4.7 list rates so unknown models err toward over-reporting.
  default_model:
    input: 5.0
    output: 25.0
  # Anthropic's published cache pricing -- override only on platforms with
  # different cache pricing (some Bedrock configurations).
  cache_read_multiplier: 0.10
  cache_write_5min_multiplier: 1.25
  cache_write_1hr_multiplier: 2.0
  data_residency_multiplier: 1.10
  fast_mode_multiplier: 6.0
  recent_pace_tasks: 10
  # Report-specific timezone override. Falls back to the top-level
  # display_timezone (and ultimately to OS local).
  # display_timezone: America/New_York

# ---------------------------------------------------------------------------
# Manifest amendment workflow (on by default; set enabled: false to opt out)
# ---------------------------------------------------------------------------
manifest_amendment:
  enabled: true
  allowed_reasons:
    - tdd_green_production_fix
  max_requests_per_execution: 1
  # Accept reason=verification_directive_defect: the pipeline may repair an
  # objectively-defective '## Verification' directive (stale assertion
  # superseded by a DONE unit, syntactic regex/quoting bug, or identifier
  # rename landed by a DONE sibling). Judge-gated (manifest-amender rubric);
  # deterministic guards keep the rewrite from ever being weaker (same AC ids,
  # same type=, same expect-exit; cited units must be done). Default: true.
  allow_verification_directive_amendments: true
  # Accept reason=manifest_row_superseded: the executor may self-remove a
  # Changes Manifest row whose file a DONE sibling renamed/deleted (otherwise
  # git-ops staging deterministically re-fails because the file is absent on
  # disk). Judge-gated; deterministic guards require the row's file ABSENT on
  # disk, every cited unit status done, and the staged diff not touching the
  # removed path -- a row whose file still exists is never removed. Default: true.
  allow_manifest_row_superseded_amendments: true

# ---------------------------------------------------------------------------
# Task factory loop (requires manifest_amendment.enabled: true)
# ---------------------------------------------------------------------------
task_factory:
  enabled: true  # default true -- set false to disable task-factory runs
  # When true (the default), sweep-proposals auto-promotes every produced
  # draft at the next loop tick. Set false to make a human review every
  # proposal. Only takes effect when task_factory.enabled is true.
  auto_accept_proposals: true

# ---------------------------------------------------------------------------
# Backlog lifecycle settings (issue #189)
# ---------------------------------------------------------------------------
# backlog:
#   # Status written into '## Status:' of every newly created work-unit file.
#   # 'draft'    -- task requires explicit human promotion (git push / status
#   #               set-status <id> in-queue) before the orchestrator picks
#   #               it up. Use this when you want a human to review every
#   #               generated work unit before execution begins.
#   # 'in-queue' -- legacy behaviour; new tasks are immediately eligible for
#   #               the next orchestrator sweep. This is the default and
#   #               preserves backwards compatibility for existing workspaces
#   #               that do not set this key (AC-189-9).
#   default_status_for_new_work_units: in-queue
#
#   # Maximum times cmd_reconcile_cascade will re-queue a blocked task with
#   # the same signature (open markers + unsatisfied deps unchanged) before
#   # tripping the circuit breaker and writing a [CASCADE_CIRCUIT_BREAKER]
#   # audit + [BLOCKED] row. The task is added to the 'escalated' envelope
#   # array so operators can identify stuck tasks. Must be >= 1. Default 3.
#   # Issue #248b, AC-248-2.
#   cascade_requeue_max_cycles: 3

# ---------------------------------------------------------------------------
# validate-backlog rule toggles. Existing rules (1-19) run unconditionally;
# the rules listed here are individually toggleable. Set a toggle to false
# to opt out (e.g. when a pre-existing backlog's AC / DoD prose is not yet
# compatible with the rule).
# ---------------------------------------------------------------------------
validate:
  # Rule 20 (issue / spec-coherence): cross-check every Task's Acceptance
  # Criteria and Definition of Done sections against the Changes Manifest.
  # Backtick-quoted path-shaped tokens that are not present in the Manifest
  # (after path normalisation) emit a validate-backlog error. Use the
  # inline "(ref)" suffix to declare a token a read-only reference and
  # exempt it from the check. See docs/backlog-contract.md.
  check_orphan_path_tokens: true

# ---------------------------------------------------------------------------
# Plugin-skill (spec-to-backlog, create-spec) configuration (issue #221
# E1-E10). The bundled skills are application-agnostic: by default they
# operate against the canonical-section list embedded in their SKILL.md
# prompts. Operators can additionally point them at a workspace-local
# exemplar for richer wording and shape, plus tune the fan-out and
# iteration budgets. All fields are optional; absent values fall through
# to skill-side defaults. See docs/skills/exemplar-reference.md.
# ---------------------------------------------------------------------------
skills:
  # Optional workspace-relative or absolute path to a representative
  # BACKLOG.md the spec-to-backlog skill consults to internalise the
  # project's quality bar. Absent => skill uses only the embedded
  # 15-section list.
  # exemplar_backlog_path: backlog/_exemplars/representative/BACKLOG.md
  #
  # Optional workspace-relative or absolute path to a representative
  # spec the create-spec skill consults. Absent => skill uses only the
  # embedded 16-section skeleton.
  # exemplar_spec_path: spec/_exemplars/representative.md
  #
  # When the Epic decomposition yields more than this many leaf tasks,
  # spec-to-backlog fans the per-task authoring out across one
  # general-purpose sub-Agent per Feature instead of writing tasks
  # serially. Default 10.
  fan_out_threshold: 10
  #
  # Maximum self-critique iterations per skill invocation before
  # emitting a [SKILL_MAX_ITERATIONS_REACHED] audit comment. Default 5.
  max_iterations: 5
  #
  # When true, both create-spec and spec-to-backlog detect the Claude Code
  # Workflow tool and fan out through it above fan_out_threshold. Default
  # false (unset-safe opt-in). When absent or false, behavior is identical
  # to today -- Agent fan-out for spec-to-backlog, single-agent for
  # create-spec. Issue #266 E12-F1-S1.
  # use_workflow: false
  #
  # Maximum tasks per Workflow chunk when use_workflow is true. Keep small
  # (default 3, max recommended 4) to stay under the provider rate limit
  # observed near 15 concurrent agents. Must be >= 1. Issue #266 spec S1.
  # workflow_chunk_size: 3
  #
  # Size/complexity gate consumed by E12-F2. When the generated spec
  # yields more than this many work units the adversarial-review hardening
  # pass is triggered. Default 10. Must be >= 1. Issue #266 spec S7.
  # adversarial_review_threshold: 10

# ---------------------------------------------------------------------------
# Per-agent model overrides (ADR-25). Every field defaults to null -- the
# agent runs on the model declared in its .md frontmatter. Operators set
# these to manage Sonnet / Opus / Bedrock quota independently when a launch's
# quota envelope is uneven (e.g. opus tokens left, sonnet exhausted).
#
# When use_bedrock: false (this file's default), values may be short names
# ("opus", "sonnet") or full Anthropic API ids ("claude-opus-4-7").
# When use_bedrock: true, values must be full Bedrock ARNs
# ("us.anthropic.claude-opus-4-7-v1"). Mismatches fail fast at config-load.
#
# HAIKU IS REJECTED AT CONFIG-LOAD (caylent-solutions/devbench#198).
# Under load the Claude Agent SDK was observed to silently drop the Agent
# tool from haiku's tool list mid-orchestration, breaking parallel sub-agent
# dispatch and forcing the orchestrator to classify work units as
# RUNTIME_DEGRADATION. Any value containing "haiku" -- short name, full
# Anthropic id, or Bedrock ARN -- raises a ValueError at config-load.
# Use "sonnet" or "opus" for every work agent.
#
# DEVBENCH_AGENT_MODEL_<NAME> env vars override this block per-call
# (precedence: env > yaml > frontmatter). See:
#   docs/adr/25-per-agent-model-overrides.md
#   docs/llm-authentication.md#per-agent-model-overrides-quota-management
# ---------------------------------------------------------------------------
# Each field below is set to the agent's current .md frontmatter default.
# The defaults are tuned by the role each agent plays:
#   - executor (writes code under TDD): sonnet -- keeps the happy-path
#     loop fast.
#   - All five judges (code-reviewer, test-reviewer, doc-reviewer,
#     changes-manifest, security-reviewer): opus -- a bad verdict costs
#     more than the inference savings; judges fire only after the
#     executor finishes a task.
#   - blocker-resolver, manifest-amender, task-factory (workflow /
#     recovery reasoning): opus -- judgment-heavy and fire only on the
#     unhappy paths, so cost is bounded.
#   - review-supervisor: sonnet -- fan-out coordinator (spawns the
#     five judges in parallel and merges their JSON verdicts). Haiku was
#     tried and dropped (caylent-solutions/devbench#198): under load the
#     SDK silently removed the Agent tool from haiku's tool list, breaking
#     parallel review_team dispatch. Haiku is now rejected at config-load.
# Uncomment + edit individual fields to retarget; absent fields stay at
# their frontmatter default. Writing the same value as the frontmatter
# default is a no-op.
# agents:
#   executor: sonnet
#   blocker_resolver: opus
#   manifest_amender: opus
#   security_reviewer: opus
#   task_factory: opus
#   review_supervisor: sonnet
#   review_team:
#     code_reviewer: opus
#     test_reviewer: opus
#     doc_reviewer: opus
#     changes_manifest: opus

# ---------------------------------------------------------------------------
# Operator-facing notifications (PR #202).
# ---------------------------------------------------------------------------
# Per-event toggles for lifecycle pings.  Each notification endpoint
# (Slack today; Discord / Teams / etc. later) lives in its own nested
# sub-block under notifications:.  Webhook URLs are credentials -- the
# recommended pattern is to leave them ``null`` here and provide them
# via env vars (`DEVBENCH_NOTIFICATIONS_SLACK_WEBHOOK_URL`) so they
# never get committed.  Every Slack payload carries a `<!here>` mention
# so the same message works whether the webhook is bound to a one-person
# private DM channel or a shared team channel.  See
# docs/slack-notifications.md for the full operator walkthrough.
# notifications:
#   enabled: false                         # master switch; flip to true to opt in
#   timeout_seconds: 10                    # per-POST HTTP timeout
#   events:
#     work_unit_done: false                # task transitions to done
#     # The next seven toggles correspond to the seven blocked-task classes
#     # (BlockedTaskState).  Each fires when a task transitions INTO that
#     # class (initial entry or reclassification).  Idempotent per (task ×
#     # class); exiting and re-entering the class re-fires.  See
#     # docs/slack-notifications.md for the per-class semantics.
#     work_unit_blocked_operator: false              # OPERATOR_ACTION_REQUIRED
#     work_unit_blocked_runtime_degradation: false   # RUNTIME_DEGRADATION (SDK Agent-tool loss; needs `make start` restart)
#     work_unit_blocked_held: false                  # HELD (status is `hold`)
#     work_unit_blocked_on_held: false               # BLOCKED_ON_HELD (marker target is `hold`)
#     work_unit_blocked_auto_clearing: false         # AUTO_CLEARING_VIA_PROPOSAL (cascade in flight)
#     work_unit_blocked_awaiting_dependency: false   # AWAITING_DEPENDENCY (regular dep still in flight)
#     work_unit_blocked_amendment_recovery: false    # AWAITING_AMENDMENT_RECOVERY (recovery signal on disk)
#     work_unit_blocked_interrupted_on_stop: false   # INTERRUPTED_ON_STOP (SIGTERM force-block; auto-requeues next sweep)
#     work_unit_materialised: false        # draft WU file written from a proposal
#     work_unit_promoted: false            # draft WU promoted to in-queue
#     pr_opened: false                     # `gh pr create` succeeded
#     pr_merged: false                     # `gh pr merge` succeeded
#     ci_failure: false                    # CI run on a WU PR failed
#     orchestrator_stop: false             # orchestrator loop exited (clean / drain / SIGTERM / crash)
#     orchestrator_auto_restart: false     # exit 42 -> Makefile loop restarting
#     quota_waiting: false                 # quota hit; orchestrator started waiting for reset
#     quota_resumed: false                 # quota recovered; run resumed
#   slack:
#     enabled: false                       # endpoint-level toggle; flip to true to enable Slack POSTs
#     webhook_url: null                    # https://hooks.slack.com/services/T.../B.../... (or via env)

# ---------------------------------------------------------------------------
# Auto-resolve engine (issue #263, E11-F1-S1).
# When enabled, the engine auto-applies a whitelisted non-destructive
# remediation (re-queue / set-status in-queue, reconcile-cascade,
# restart-signal) without operator intervention.
# Default: disabled -- advise-only mode is preserved by default (opt-in).
# Override via DEVBENCH_AUTO_RESOLVE_ENABLED env var (true/false/1/0).
# ---------------------------------------------------------------------------
# auto_resolve:
#   enabled: false            # set true to activate auto-apply (opt-in)
#   max_attempts: 3           # max auto-apply attempts before operator escalation (E11-F1-S2)

# ---------------------------------------------------------------------------
# Diagnostic-tuning knobs (set only when investigating a specific cadence
# problem; production workspaces leave this section absent).
# ---------------------------------------------------------------------------

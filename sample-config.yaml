# DevBench runtime configuration -- sample / starting point
#
# Copy this file to your workspace: cp sample-config.yaml backlog/config/devbench.yaml
#
# Precedence: environment variables > this file > code defaults
#
# Config file path resolution order:
#   1. --config <path>          CLI argument
#   2. JUDGE_CONFIG_PATH        environment variable
#   3. backlog/config/devbench.yaml  (default, relative to JUDGE_WORKSPACE_ROOT)
#
# repos: defines allowed repositories and optional per-repo settings.
# At least one entry is required. Keys must be in "org/repo" format.
#
# Per-repo fields:
#   default_branch      (optional) -- branch used for git diff and PR --base.
#                                    Omit to fall back to origin/HEAD.
#   checkout_directory  (optional) -- relative path from JUDGE_WORKSPACE_ROOT to
#                                    the local checkout. Must be relative (no leading
#                                    / or .. traversal). Omit to use the repo short
#                                    name (e.g. "devbench" for "caylent-solutions/devbench").

repos:
  caylent-solutions/devbench:
    default_branch: main
    checkout_directory: devbench

# git_ops: controls git workflow behaviour after PR merge.
#
# update_submodule  (optional, default false) -- set true only when target repos
#                   are git submodules of a parent workspace repo.  When true,
#                   cmd_git_ops will stage and commit the updated submodule
#                   pointer in the parent repo after each PR merge.
#
# git_ops:
#   update_submodule: false

# manifest_amendment: opt-in Changes Manifest amendment workflow.
#
# When enabled, executors that discover a required production fix during
# TDD GREEN can request an amendment to the work unit's Changes Manifest.
# A dedicated judge reviews the request, and on approval the manifest is
# updated atomically with a Layer 3 deterministic post-check. When
# disabled (the default), executors that hit an undeclared production fix
# escalate for human review instead of staging the file.
#
# enabled                   (optional, default false) -- set true to opt the
#                           backlog into the amendment workflow.
# allowed_reasons           (optional) -- list of amendment reasons accepted
#                           by this backlog. Default: ["tdd_green_production_fix"].
# max_requests_per_execution (optional, default 1) -- upper bound on
#                           amendments applied to one task during one
#                           executor run.
#
# manifest_amendment:
#   enabled: false
#   allowed_reasons:
#     - tdd_green_production_fix
#   max_requests_per_execution: 1

# task_factory: opt-in task-factory loop.
#
# When enabled (and manifest_amendment is also enabled), a legitimate
# amendment rejection triggers blocker-resolver -> task-factory, which
# drafts one or more new work units with status `proposed` covering
# the out-of-scope production fixes the amender surfaced. The operator
# reviews, edits, and promotes each draft via `devbench promote-proposal`
# or rejects it via `devbench reject-proposal`.
#
# enabled                  (optional, default false) -- requires manifest_amendment.enabled: true.
# auto_accept_proposals    (optional, default false) -- when true, devbench
#                          sweep-proposals auto-promotes every produced draft
#                          at the next orchestrate loop tick instead of
#                          leaving it at `proposed` for human review. Every
#                          auto-promoted draft's [PROPOSAL_PROMOTED] comment
#                          carries the `(auto-accepted via ...)` suffix so
#                          the audit trail reflects the tool, not a human.
#                          See docs/adr/11-auto-accept-proposals.md.
#
# task_factory:
#   enabled: false
#   auto_accept_proposals: false

# Work-unit lifecycle statuses
# ---------------------------------------------------------------------------
# The `## Status:` line in every work-unit .md accepts these values:
#   in-queue      actionable, orchestrator will claim this
#   in-progress   orchestrator has claimed the unit
#   in-review     executor done; judges running
#   done          completed and shipped
#   blocked       waiting on external resolution (dependency, human, infra)
#   proposed      task-factory draft awaiting human promotion (inert)
#   declined      operator decided this work will never be done (terminal)
#
# The `declined` status is universal (not opt-in). Mark work declined with:
#   uv run devbench decline <id> --reason "<message>"
#
# Declined children count as "terminal-complete" for parent rollup: a
# Story/Feature/Epic rolls to done once every child is Done or Declined.
# Declined tasks are excluded from tasks_remaining and from projection ETAs,
# and surface in a dedicated `Declined (N):` panel in `devbench report`.

# display_timezone: IANA timezone name (e.g. "America/New_York", "Europe/London")
# applied by every devbench command that renders timestamps -- devbench report,
# devbench hook-tail, devbench watch, and any future command. When unset, each
# command defaults to the OS local timezone. Override per-invocation via the
# JUDGE_DISPLAY_TIMEZONE env var. Per-command overrides (report.display_timezone,
# JUDGE_REPORT_TIMEZONE, hook-tail --tz) still take precedence.
#
# display_timezone: America/New_York

# report: contains report-specific settings. Most operators don't need to set
# these explicitly -- the code defaults match Opus 4.7 list pricing. Set them
# only when running against a different model or when your contract has a
# different rate structure. See devbench docs/model-pricing.md for the full
# semantic and the worked-examples table.
#
# report:
#   # Contract discount (correction factor) off list-price token cost. Fraction
#   # in [0.0, 1.0]. final_cost = raw_list_cost * (1 - token_cost_discount).
#   # Default 0.0 = no discount (pay full list). E.g. 0.25 = 25% off list.
#   token_cost_discount: 0.0

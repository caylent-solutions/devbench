repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        types: [python]
        pass_filenames: false

      - id: comment-lint
        name: python comment check
        entry: make lint-comments
        language: system
        types: [python]
        pass_filenames: false

      - id: markdown-lint
        name: markdown lint
        entry: make lint-markdown
        language: system
        types: [markdown]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pre-push-validate
        name: full validation (lint + typecheck + test + coverage)
        entry: make pre-push-check
        language: system
        pass_filenames: false
        stages: [pre-push]

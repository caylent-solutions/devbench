# DevBench runtime configuration -- comprehensive reference.
#
# Copy this file to `<workspace>/backlog/config/devbench.yaml` as a starting
# point. Every YAML field defined in `src/devbench/config-schema.json` is
# represented below at its default value. Delete sections you do not need.
#
# Precedence: env var > this YAML > code default. Schema validation runs at
# load time; any unknown key fails with a clear error.

# ---------------------------------------------------------------------------
# Required: at least one repo
# ---------------------------------------------------------------------------
repos:
  caylent-solutions/devbench:
    default_branch: main
    checkout_directory: devbench
    # Per-repo merge_strategy override; falls back to the top-level merge_strategy.
    # merge_strategy: squash

# ---------------------------------------------------------------------------
# Top-level identity / runtime knobs
# ---------------------------------------------------------------------------

# Default merge strategy for every repo unless overridden per-repo above.
merge_strategy: squash

# Maximum executor retries per work unit -- shared budget across review-judge
# retries, CI-failure retries, and PR-bot-feedback retries (see git_ops below).
max_executor_retries: 10

# Per-judge override of max_executor_retries (issue #122). Each value falls
# back to max_executor_retries when absent. Useful when one judge is flakey
# (more retries) and another is stable (fewer retries to fail-fast on real bugs).
max_executor_retries_per_judge:
  code_review: 10
  test_review: 10
  doc_review: 10
  changes_manifest: 10
  security_review: 10

# When true, route LLM calls via AWS Bedrock instead of the Anthropic API.
use_bedrock: false

# AWS region for Bedrock when use_bedrock: true.
bedrock_region: us-east-1

# Per-agent model overrides live in the `agents:` block lower in this file
# (ADR-25). `JUDGE_CLAUDE_MODEL` (env var, required) is the SDK caller's
# model -- it governs the orchestrate skill's coordination calls only; it
# does NOT route the work agents (executor / judges / etc.), each of which
# loads its model from its plugin .md frontmatter and can be overridden
# via the `agents:` block.

# Hard allowlist of GitHub orgs devbench may operate against. Empty means
# every org listed in repos: above is permitted; otherwise restrict here.
allowed_orgs: []

# IANA timezone applied to every timestamp-rendering command (report,
# hook-tail, watch). Unset = OS local timezone.
# display_timezone: America/New_York

# Workspace-relative path to the orchestrator's structured log file. Both
# the writer (setup_logging) and the readers (report, hook-tail) consult
# this single source of truth so they cannot diverge.
log_file: logs/orchestrator.log

# ---------------------------------------------------------------------------
# Timeouts (seconds)
# ---------------------------------------------------------------------------
timeouts:
  gh_api: 30
  test: 300
  security_fetch: 120
  llm: 300
  command: 120
  executor: 600
  executor_max_turns: 100
  orchestrator_poll_interval: 10
  github_check: 600

# ---------------------------------------------------------------------------
# Limits / thresholds
# ---------------------------------------------------------------------------
limits:
  alert_summary: 10
  output_truncation: 2000
  llm_evidence_truncation: 15000
  llm_file_context: 5
  llm_file_preview_chars: 3000
  # Issue #115: byte cap for the trimmed failing-job log written to
  # `<workspace>/.devbench/ci-failures/<id>-<n>.log`. Caps executor feedback
  # payload size. Operators bump this when CI logs legitimately need a
  # longer relevant tail (rare).
  ci_failure_log_bytes: 32768

# ---------------------------------------------------------------------------
# Git operations
# ---------------------------------------------------------------------------
git_ops:
  # Set true only when target repos are git submodules of a parent workspace
  # repo. When true, the parent repo's submodule pointer is updated after
  # each PR merge.
  update_submodule: false
  # Single-branch mode: every work unit commits to this branch (see defer_pr
  # below). Unset = standard multi-PR mode (one branch per work unit).
  # single_branch: feat/my-batch-branch
  # Defer-PR mode: commits stay local until `devbench git-ops-finalize` runs.
  # Requires single_branch to be set.
  defer_pr: false
  # Issue #101: when true, cmd_git_ops pushes the PR + waits for green CI,
  # then transitions the work unit to in-review instead of merging. The
  # orchestrator's loop reconciles in-review tasks via cmd_check_merge.
  # Mutually exclusive with defer_pr and single_branch (validated at load).
  pause_before_merge: false
  # Phase 1 of the orphan-cascade fix. When true (the default), git-ops
  # runs cleanup_tracked_orphans inline as a chore commit before the task's
  # commit when build/state orphan paths are detected.
  inline_orphan_cleanup: true
  # Issue #115: when true (the default after the v-next flip), CI failure
  # returns rc=2 to trigger an executor retry with the failing-job log as
  # feedback. Set to false for the legacy rc=1 BLOCKED behaviour.
  ci_failure_retry: true
  # Operator override of the built-in orphan-pattern fnmatch list. Empty =
  # use the built-in list (terraform state, terragrunt cache, Python
  # pycache, coverage, etc.). Non-empty REPLACES the built-in entirely.
  orphan_patterns: []
  # When true, the orchestrate skill automatically invokes
  # `devbench git-ops-finalize <repo>` once all work units for the repo
  # are terminal. Requires defer_pr: true. Incompatible with local_only: true.
  # A marker file at <workspace>/.devbench/auto-finalize-fired-<repo>.marker
  # prevents duplicate invocations. Default: false.
  auto_finalize: false
  # When true, the orchestrate skill automatically invokes
  # `gh pr merge --<merge_strategy>` once the post-E7 CI watcher reports
  # GREEN. Requires auto_finalize: true AND defer_pr: true.
  # Incompatible with local_only: true. When the E7 watcher is absent,
  # emits [AUTO_MERGE_SKIPPED] no_ci_watcher and skips. A marker file at
  # <workspace>/.devbench/auto-merge-fired-<repo>.marker prevents duplicates.
  # Default: false.
  auto_merge: false
  # Issue #116: opt-in PR review-comment polling. When enabled, cmd_git_ops
  # polls `gh pr view` between CI-pass and merge for asynchronous review
  # bot comments (Copilot, Q-Dev, internal review services).
  pr_review_resolution:
    enabled: false
    # Comma-separated logins whose unresolved comments block the merge.
    # Example: ["github-copilot[bot]", "amazon-q-developer[bot]"]
    agents: []
    # When true, reviewDecision == CHANGES_REQUESTED hard-blocks merge
    # regardless of bot allowlist.
    decision_blocks: true
    # Total settle-window length, seconds.
    settle_seconds: 60
    # Per-poll cadence inside the settle window, seconds.
    poll_interval: 5

# ---------------------------------------------------------------------------
# Stop-hook circuit breaker
# ---------------------------------------------------------------------------
stop_hook:
  max_blocks: 5
  # Quiet-window cap for the circuit breaker. Doubles as the threshold
  # for `devbench report`'s orchestrator-alive banner (issue #161): a
  # log line within this many seconds renders the banner green ALIVE,
  # past it renders red STOPPED. Tune this once for your workload's
  # quiet-window tolerance and the banner stays aligned automatically.
  window_seconds: 180
  stale_task_minutes: 120

# ---------------------------------------------------------------------------
# devbench hook-tail column caps (issue #134)
# ---------------------------------------------------------------------------
hook_tail:
  # Column width for the agent name.
  agent_width: 12
  # Column width for the tool name.
  tool_width: 8
  # Max chars for the description column (bumped from 100 in v-next).
  description_max: 120
  # Max chars for the result-preview column after the pipe.
  stdout_preview_max: 80

# ---------------------------------------------------------------------------
# Orchestrator runtime tuning (issue #144)
# ---------------------------------------------------------------------------
orchestrate:
  # Cap on recovery-of-a-recovery cascade depth. When a proposal would land
  # at depth >= this cap, the source task transitions to
  # NEEDS_OPERATOR_ATTENTION instead of materialising another recovery
  # layer. Override via JUDGE_ORCHESTRATE_MAX_CASCADE_DEPTH env var.
  max_cascade_depth: 2

# ---------------------------------------------------------------------------
# Report / cost estimation
# ---------------------------------------------------------------------------
report:
  # Defaults match Opus 4.7 list pricing. Set explicitly only when running a
  # different model or when your contract has a different rate structure.
  #
  # Calibration guidance:
  # The reported cost should equal actual API billing within ~1%. If reported
  # cost drifts from actual (e.g., model swap, 1M-context premium tier, or
  # non-list contract pricing), derive a correction factor from a recent run:
  #     correction = actual_billing / reported_cost
  # Multiply BOTH per-million rates below by that factor; the input/output
  # ratio is preserved and the cache-read / cache-write / data-residency
  # multipliers below compose correctly on top of the corrected base rate.
  #
  # NOTE: `token_cost_discount` (below) only DECREASES reported cost, so it is
  # the wrong knob for under-reporting. Always correct upward via the per-
  # million rates above.
  token_cost_per_million_input: 5.0
  token_cost_per_million_output: 25.0
  # Contract discount off list price as a fraction in [0.0, 1.0].
  # final_cost = raw_list_cost * (1 - token_cost_discount). 0.0 = full list.
  token_cost_discount: 0.0
  # Anthropic's published cache pricing -- override only on platforms with
  # different cache pricing (some Bedrock configurations).
  cache_read_multiplier: 0.10
  cache_write_5min_multiplier: 1.25
  cache_write_1hr_multiplier: 2.0
  data_residency_multiplier: 1.10
  fast_mode_multiplier: 6.0
  recent_pace_tasks: 10
  # Report-specific timezone override. Falls back to the top-level
  # display_timezone (and ultimately to OS local).
  # display_timezone: America/New_York

# ---------------------------------------------------------------------------
# Manifest amendment workflow (opt-in)
# ---------------------------------------------------------------------------
manifest_amendment:
  enabled: false
  allowed_reasons:
    - tdd_green_production_fix
  max_requests_per_execution: 1

# ---------------------------------------------------------------------------
# Task factory loop (requires manifest_amendment.enabled: true)
# ---------------------------------------------------------------------------
task_factory:
  enabled: false
  # When true, sweep-proposals auto-promotes every produced draft at the
  # next loop tick. Default false preserves "human reviews every proposal".
  auto_accept_proposals: false

# ---------------------------------------------------------------------------
# Backlog lifecycle settings (issue #189)
# ---------------------------------------------------------------------------
# backlog:
#   # Status written into '## Status:' of every newly created work-unit file.
#   # 'draft'    -- task requires explicit human promotion (git push / status
#   #               set-status <id> in-queue) before the orchestrator picks
#   #               it up. Use this when you want a human to review every
#   #               generated work unit before execution begins.
#   # 'in-queue' -- legacy behaviour; new tasks are immediately eligible for
#   #               the next orchestrator sweep. This is the default and
#   #               preserves backwards compatibility for existing workspaces
#   #               that do not set this key (AC-189-9).
#   default_status_for_new_work_units: in-queue

# ---------------------------------------------------------------------------
# Opt-in validate-backlog rules. Existing rules (1-19) run unconditionally;
# rules listed here are gated to keep pre-existing backlogs green during
# rollout. Flip a toggle to true after auditing your backlog's AC / DoD
# prose for compatibility with the rule.
# ---------------------------------------------------------------------------
validate:
  # Rule 20 (issue / spec-coherence): cross-check every Task's Acceptance
  # Criteria and Definition of Done sections against the Changes Manifest.
  # Backtick-quoted path-shaped tokens that are not present in the Manifest
  # (after path normalisation) emit a validate-backlog error. Use the
  # inline "(ref)" suffix to declare a token a read-only reference and
  # exempt it from the check. See docs/backlog-contract.md.
  check_orphan_path_tokens: false

# ---------------------------------------------------------------------------
# Per-agent model overrides (ADR-25). Every field defaults to null -- the
# agent runs on the model declared in its .md frontmatter. Operators set
# these to manage Sonnet / Opus / Bedrock quota independently when a launch's
# quota envelope is uneven (e.g. opus tokens left, sonnet exhausted).
#
# When use_bedrock: false (this file's default), values may be short names
# ("opus", "sonnet", "haiku") or full Anthropic API ids ("claude-opus-4-7").
# When use_bedrock: true, values must be full Bedrock ARNs
# ("us.anthropic.claude-opus-4-7-v1"). Mismatches fail fast at config-load.
#
# DO NOT PIN ANY WORK AGENT TO HAIKU. Empirical observation in this codebase:
# under load the Claude Agent SDK was observed to silently drop the Agent
# tool from haiku's tool list mid-orchestration, breaking parallel sub-agent
# dispatch and forcing the orchestrator to classify work units as
# RUNTIME_DEGRADATION. Sonnet is the minimum recommended for every work
# agent. The short-name "haiku" is still parsed (you can experiment) but
# every role default below avoids it.
#
# JUDGE_AGENT_MODEL_<NAME> env vars override this block per-call
# (precedence: env > yaml > frontmatter). See:
#   docs/adr/25-per-agent-model-overrides.md
#   docs/llm-authentication.md#per-agent-model-overrides-quota-management
# ---------------------------------------------------------------------------
# Each field below is set to the agent's current .md frontmatter default.
# The defaults are tuned by the role each agent plays:
#   - executor (writes code under TDD): sonnet -- keeps the happy-path
#     loop fast.
#   - All five judges (code-reviewer, test-reviewer, doc-reviewer,
#     changes-manifest, security-reviewer): opus -- a bad verdict costs
#     more than the inference savings; judges fire only after the
#     executor finishes a task.
#   - blocker-resolver, manifest-amender, task-factory (workflow /
#     recovery reasoning): opus -- judgment-heavy and fire only on the
#     unhappy paths, so cost is bounded.
#   - review-supervisor: sonnet -- fan-out coordinator (spawns the
#     five judges in parallel and merges their JSON verdicts). Haiku was
#     tried and dropped: under load the SDK was observed to silently
#     remove the Agent tool from haiku's tool list, breaking parallel
#     review_team dispatch. Opus here would be waste.
# Uncomment + edit individual fields to retarget; absent fields stay at
# their frontmatter default. Writing the same value as the frontmatter
# default is a no-op.
# agents:
#   executor: sonnet
#   blocker_resolver: opus
#   manifest_amender: opus
#   security_reviewer: opus
#   task_factory: opus
#   review_supervisor: sonnet
#   review_team:
#     code_reviewer: opus
#     test_reviewer: opus
#     doc_reviewer: opus
#     changes_manifest: opus

# ---------------------------------------------------------------------------
# Diagnostic-tuning knobs (set only when investigating a specific cadence
# problem; production workspaces leave this section absent).
# ---------------------------------------------------------------------------
# debug:
#   # Issue #114: number of times wait_for_checks retries gh pr checks when
#   # 'no checks reported' contradicts the local workflow-file glob.
#   check_registration_retries: 12
#   check_registration_delay_seconds: 5
#   # 3-state classifier: recency cap (seconds) for AWAITING_AUTO_RECOVERY
#   # signal. Tasks whose most recent [BLOCKED] audit-comment is older than
#   # this fall through to NEEDS_OPERATOR_ATTENTION.
#   blocked_recovery_window_seconds: 1800

# DevBench runtime configuration for the kanon-deps-work backlog.
#
# Every field in src/devbench/config-schema.json is represented EXPLICITLY here
# at its operator-chosen value (no hidden defaults). When a value matches
# devbench's built-in default, the comment ends with " (built-in default)".
#
# Operator intent: single-PR mode that makes PRs, watches CI, resolves CI
# issues; every feature that helps fix issues, propose work, fix blocks, and
# cascade recovery is ON. The only items explicitly OFF are mode-incompatible
# choices (pause_before_merge is incompatible with defer_pr; local_only is
# incompatible with the auto-finalize / auto-merge / remote-PR flow we want).

# ---------------------------------------------------------------------------
# Required: target repos
# ---------------------------------------------------------------------------
repos:
  caylent-solutions/kanon:
    default_branch: main
    checkout_directory: kanon
    # No per-repo merge_strategy override; uses top-level merge_strategy.
  caylent/caylent-private-kanon:
    default_branch: main
    checkout_directory: caylent-private-kanon
  caylent/kanon-claude-marketplaces:
    default_branch: main
    checkout_directory: kanon-claude-marketplaces

# ---------------------------------------------------------------------------
# Top-level identity / runtime knobs
# ---------------------------------------------------------------------------

# Default merge strategy for every repo (single-PR / squash semantics).
merge_strategy: squash

# Executor retry budget, shared across review-judge retries, CI-failure
# retries, and PR-bot-feedback retries.
max_executor_retries: 10                # (built-in default)

# Per-judge override of max_executor_retries.
max_executor_retries_per_judge:
  code_review: 10                       # (built-in default)
  test_review: 10                       # (built-in default)
  doc_review: 10                        # (built-in default)
  changes_manifest: 10                  # (built-in default)
  security_review: 10                   # (built-in default)

# LLM routing.
use_bedrock: false                      # (built-in default; Anthropic API path)
bedrock_region: us-east-1               # (built-in default; harmless when use_bedrock=false)

# `DEVBENCH_CLAUDE_MODEL` (env var, set by the launcher) is the SDK caller's
# model -- it governs the orchestrate skill's coordination calls only. Per-
# agent work models live in the `agents:` block (ADR-25); each agent loads
# its default from its plugin .md frontmatter and is overridable
# independently. Add an `agents:` block here when an operator needs to
# retarget specific agents to a different model.

# Hard allowlist of GitHub orgs devbench may operate against. Listing the
# orgs of every repo above is belt-and-suspenders against accidental cross-org
# operations (e.g., a misconfigured target_repo silently pointing at the wrong
# org would be refused at config-load time).
allowed_orgs:
  - caylent-solutions
  - caylent

# Timezone for every timestamp-rendering command (report, hook-tail, watch).
# Unset = OS local timezone.
# display_timezone: America/New_York

# Workspace-relative path to the orchestrator's structured log file. Both the
# writer (setup_logging) and the readers (report, hook-tail) consult this
# field, so report-vs-orchestrator log-file drift is impossible.
log_file: logs/orchestrator.log         # (built-in default; explicit for clarity)

# ---------------------------------------------------------------------------
# Timeouts (seconds)
# ---------------------------------------------------------------------------
timeouts:
  gh_api: 30                            # (built-in default)
  test: 300                             # (built-in default)
  security_fetch: 120                   # (built-in default)
  llm: 300                              # (built-in default)
  command: 120                          # (built-in default)
  executor: 600                         # (built-in default)
  executor_max_turns: 100               # (built-in default)
  orchestrator_poll_interval: 10        # (built-in default)
  github_check: 600                     # (built-in default)

# ---------------------------------------------------------------------------
# Limits / thresholds
# ---------------------------------------------------------------------------
limits:
  alert_summary: 10                     # (built-in default)
  output_truncation: 2000               # (built-in default)
  llm_evidence_truncation: 15000        # (built-in default)
  llm_file_context: 5                   # (built-in default)
  llm_file_preview_chars: 3000          # (built-in default)
  ci_failure_log_bytes: 32768           # (built-in default; 32 KiB CI-failure log trim)

# ---------------------------------------------------------------------------
# Git operations -- SINGLE-PR MODE with auto-finalize + auto-merge + CI retry
# ---------------------------------------------------------------------------
#
# Mode picked: single-branch + defer_pr + auto_finalize + auto_merge.
#   - Every work unit commits to feat/kanon-deps-work (the shared branch).
#   - When every work unit terminates, the orchestrator runs git-ops-finalize
#     automatically, which pushes the branch and creates ONE PR per repo.
#   - When CI on that PR turns green, the orchestrator auto-merges using the
#     top-level merge_strategy: squash.
#   - ci_failure_retry keeps CI failures inside the executor retry loop (the
#     failing job log is fed back to the executor as feedback).
#   - pr_review_resolution polls for PR-bot feedback (Copilot, etc.) before
#     merging; even with an empty agents list, decision_blocks: true makes
#     reviewDecision == CHANGES_REQUESTED a hard merge-block.
#
# Mutually-exclusive modes left OFF (explicit):
#   - pause_before_merge: false  -- incompatible with defer_pr: true.
#   - local_only: false          -- we DO want a remote PR.
git_ops:
  # When true, update parent repo's submodule pointer after PR merge.
  # Our target repos are not submodules of kanon-deps-work; leave off.
  update_submodule: false               # (built-in default)

  # Single-branch mode: every work unit commits to this branch.
  single_branch: feat/kanon-deps-work-2026-05

  # Defer-PR: commits stay local until git-ops-finalize creates the PR.
  defer_pr: true

  # Pause-before-merge is incompatible with defer_pr. EXPLICITLY off.
  pause_before_merge: false             # (built-in default)

  # Inline orphan cleanup: when build/state artefacts are detected at commit
  # time, run cleanup_tracked_orphans as a chore commit inline. ON by design
  # so the cascade pathology (multiple parents proposing duplicate cleanups)
  # cannot happen.
  inline_orphan_cleanup: true           # (built-in default)

  # CI-failure retry: when CI fails, return rc=2 so the executor retries with
  # the failing-job log as feedback (instead of immediately blocking the task).
  # ON by design -- this is the "resolve CI issues" feature.
  ci_failure_retry: true                # (built-in default since v-next)

  # Operator override of the built-in orphan-pattern fnmatch list. Empty =
  # use the built-in list (terraform state, terragrunt cache, Python pycache,
  # coverage artefacts, node_modules, .DS_Store). We use the built-in list.
  orphan_patterns: []                   # (built-in default)

  # Local-only mode: target repo has no remote. EXPLICITLY off; we DO want
  # remote pushes, PRs, and CI on every target repo.
  local_only: false                     # (built-in default)

  # Auto-finalize: when every actionable unit reaches a terminal state, the
  # orchestrator runs git-ops-finalize automatically (creates the PR, watches
  # CI). ON because we want zero manual steps in the single-PR flow.
  auto_finalize: true

  # Auto-merge: after the post-finalize CI watcher reports GREEN, the
  # orchestrator runs `gh pr merge --squash` automatically. ON because we
  # want zero manual steps; the only gate is CI green + PR-review settle.
  auto_merge: true

  # PR review-comment polling: poll `gh pr view` between CI-pass and merge for
  # asynchronous review-bot comments (Copilot, Amazon Q Dev, internal review
  # services). ON with sensible defaults; populate `agents` with bot logins if
  # the target repo has any.
  pr_review_resolution:
    enabled: true
    # Bot logins whose unresolved comments block merge. Empty here; populate
    # when bots are added to the target repos. The merge gate stays active
    # via decision_blocks even with no bots in the allowlist.
    agents: []
    # When reviewDecision == CHANGES_REQUESTED, hard-block the merge
    # regardless of bot allowlist. ON by design.
    decision_blocks: true               # (built-in default)
    # Total settle-window length for the PR-review poll loop, seconds.
    settle_seconds: 60                  # (built-in default)
    # Per-poll cadence inside the settle window, seconds.
    poll_interval: 5                    # (built-in default)

# ---------------------------------------------------------------------------
# Stop-hook circuit breaker
# ---------------------------------------------------------------------------
stop_hook:
  max_blocks: 5                         # (built-in default)
  window_seconds: 180                   # (built-in default; also drives the report banner)
  stale_task_minutes: 120               # (built-in default)

# ---------------------------------------------------------------------------
# devbench hook-tail column caps (operator-readability tuning)
# ---------------------------------------------------------------------------
hook_tail:
  agent_width: 12                       # (built-in default)
  tool_width: 8                         # (built-in default)
  description_max: 120                  # (built-in default)
  stdout_preview_max: 80                # (built-in default)

# ---------------------------------------------------------------------------
# Orchestrator runtime tuning
# ---------------------------------------------------------------------------
orchestrate:
  # Cap on recovery-of-a-recovery cascade depth. When a proposal would land at
  # depth >= this cap, the source task transitions to NEEDS_OPERATOR_ATTENTION.
  # Default 2 is the conservative-but-enabled posture. We keep 2 because deeper
  # cascades typically indicate a real spec defect that should surface.
  max_cascade_depth: 2                  # (built-in default)

# ---------------------------------------------------------------------------
# Report / cost estimation
# ---------------------------------------------------------------------------
report:
  # Defaults below match Opus 4.7 list pricing. Override these if you run on
  # a different model contract.
  token_cost_per_million_input: 5.0     # (built-in default for the current sample)
  token_cost_per_million_output: 25.0   # (built-in default for the current sample)
  token_cost_discount: 0.0              # (built-in default; no contract discount applied)
  cache_read_multiplier: 0.10           # (built-in default)
  cache_write_5min_multiplier: 1.25     # (built-in default)
  cache_write_1hr_multiplier: 2.0       # (built-in default)
  data_residency_multiplier: 1.10       # (built-in default)
  fast_mode_multiplier: 6.0             # (built-in default)
  recent_pace_tasks: 10                 # (built-in default)
  display_timezone: America/New_York   # (unset; falls through to OS local)

# ---------------------------------------------------------------------------
# Manifest amendment workflow -- ON
# ---------------------------------------------------------------------------
#
# Lets the executor request a Changes Manifest update during TDD GREEN when a
# production fix is needed that wasn't pre-declared. The amender judge gates
# the request; the post-check rolls back on failure. This is one of the
# "fix issues" features the operator asked to have ON.
manifest_amendment:
  enabled: true
  allowed_reasons:
    - tdd_green_production_fix          # (only currently-supported reason; required when enabled)
  max_requests_per_execution: 1         # (built-in default; prevents amendment loops)

# ---------------------------------------------------------------------------
# Task factory loop -- ON, auto-accept ON
# ---------------------------------------------------------------------------
#
# When the amender rejects (because the fix is out of scope), the
# blocker-resolver decomposes the rejection into a proposal JSON, and
# task-factory materialises one draft work unit per proposed task.
# auto_accept_proposals=true closes the loop: the orchestrator promotes
# every draft on its next sweep tick without waiting for a human. This is
# the "propose work" + "fix blocks" feature the operator asked to have ON.
task_factory:
  enabled: true                         # requires manifest_amendment.enabled: true (validated)
  auto_accept_proposals: true

# ---------------------------------------------------------------------------
# Opt-in validate-backlog rules -- ON
# ---------------------------------------------------------------------------
#
# Rule 20: cross-check AC / DoD prose against the Changes Manifest. Catches
# spec drift where a path token in prose disagrees with the Manifest. ON
# because we author this backlog from a precise spec and want every drift
# caught at validate-backlog time.
validate:
  check_orphan_path_tokens: true

# ---------------------------------------------------------------------------
# Diagnostic-tuning knobs (not set; production workspaces leave this absent)
# ---------------------------------------------------------------------------
# debug:
#   check_registration_retries: 12      # (built-in default)
#   check_registration_delay_seconds: 5  # (built-in default)
#   blocked_recovery_window_seconds: 1800

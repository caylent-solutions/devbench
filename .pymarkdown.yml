---
# Markdown lint configuration (pymarkdown).
#
# Baseline mirrors caylent/kanon-claude-marketplaces so Claude plugin /
# marketplace markdown (YAML-frontmatter skill, agent, and command files)
# lints cleanly:
#   - the front-matter extension parses the leading YAML block instead of
#     flagging it as an unexpected horizontal rule / heading;
#   - emphasis-as-heading is disabled (skill bodies use bold lead-ins);
#   - duplicate-heading is scoped to sibling headings only.
#
# The `disabled` rules below grandfather the existing reference-doc corpus,
# which intentionally uses long table/prose lines, language-less console
# blocks, repeated structural headings (Keep-a-Changelog / ADR sections),
# and `?`/`:` headings. They are stylistic or carry false positives on
# example/manifest content, and pymarkdown's fixer cannot resolve them
# safely. Every other rule stays enabled and is enforced going forward;
# mechanical issues are auto-fixed by `make format-markdown`.
extensions:
  front-matter:
    enabled: true
plugins:
  no-emphasis-as-heading:
    enabled: false
  no-duplicate-heading:
    enabled: false
  line-length:
    enabled: false
  fenced-code-language:
    enabled: false
  blanks-around-lists:
    enabled: false
  blanks-around-headings:
    enabled: false
  blanks-around-fences:
    enabled: false
  no-trailing-punctuation:
    enabled: false
  no-missing-space-atx:
    enabled: false
  no-inline-html:
    enabled: false
  no-space-in-code:
    enabled: false
  ol-prefix:
    enabled: false
  no-blanks-blockquote:
    enabled: false
  commands-show-output:
    enabled: false
  no-hard-tabs:
    enabled: false
  no-bare-urls:
    enabled: false
